[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-internship-radar"
version = "1.0.0"
description = "Personal internship discovery, eligibility, and prioritization automation."
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
